</head>

    <!-- 移动端搜索框 -->

        <input 
          type="text"

          oninput="handleMobileSearch()"

  </header>

  <!-- ================= 欧美先锋 Hero 横幅 ================= -->
  <section class="relative overflow-hidden bg-gradient-to-b from-white via-brand-50/30 to-[#F8FAFC] pt-12 pb-8 border-b border-slate-200/60">
    <!-- 背景大字水印 (Bold Editorial Typography) -->
    <div class="hero-watermark absolute -bottom-8 right-0 text-slate-900/[0.03] font-extrabold select-none pointer-events-none">

    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-900 text-white text-[11px] font-semibold tracking-wider uppercase mb-4 shadow-sm">
        <span class="w-1.5 h-1.5 rounded-full bg-cyanAccent-400"></span>
        Yuntrol Official Catalog
      </div>
      <h2 class="text-3xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight max-w-3xl">
        源创智控 · <span class="bg-gradient-to-r from-brand-600 via-brand-500 to-cyanAccent-500 bg-clip-text text-transparent">智慧互联图册</span>

      <p class="mt-3 text-slate-500 text-sm sm:text-base max-w-2xl font-normal leading-relaxed">

        <!-- JS 动态联动渲染二级分类 -->
      </div>

  </section>

  <!-- ================= 主体相册网格 ================= -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    
    <!-- 状态指示栏 -->
    <div class="flex items-center justify-between mb-6">
      <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <span id="currentFilterLabel">全部作品</span>
        <span class="text-slate-300">/</span>
        <span id="itemCountLabel" class="text-brand-600">展示中</span>
      </div>
    </div>

    <!-- 瀑布流/网格展示容器 -->
    <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
      <!-- 画册卡片通过 JS 渲染 -->
    </div>

    <!-- 空状态提示 (搜索不到时显示) -->
    <div id="emptyState" class="hidden text-center py-24">
      <div class="w-16 h-16 mx-auto rounded-2xl bg-brand-50 text-brand-500 flex items-center justify-center mb-4">
        <i data-lucide="image-off" class="w-8 h-8"></i>
      </div>
      <h3 class="text-lg font-bold text-slate-800">未找到相关画册照片</h3>

      <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-brand-600 text-white rounded-lg text-xs font-medium hover:bg-brand-700 transition">
        重置所有筛选
      </button>
    </div>

  </main>

  <!-- ================= 图片大图预览弹窗 (Lightbox) ================= -->
    <!-- ================= 图片大图预览弹窗 (支持多图与左右翻页) ================= -->
  <div id="lightbox" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md hidden flex items-center justify-center p-4 select-none" onclick="closeLightbox(event)">
    <div class="relative max-w-5xl w-full bg-slate-900 rounded-2xl overflow-hidden shadow-2xl border border-slate-800" onclick="event.stopPropagation()">
      <!-- 关闭按钮 -->
      <button onclick="closeLightbox(event)" class="absolute top-4 right-4 z-20 w-10 h-10 rounded-full bg-slate-800/80 hover:bg-slate-700 text-white flex items-center justify-center transition">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      
      <div class="flex flex-col lg:flex-row max-h-[85vh]">
        <!-- 左侧大图展示区（含左右箭头和计数器） -->
        <div class="relative lg:w-3/4 bg-black flex items-center justify-center p-2 min-h-[360px] max-h-[75vh]">
          <img id="lightboxImg" src="" alt="" class="max-h-[72vh] max-w-full object-contain transition-all duration-150">
          
          <!-- 左翻页按钮 -->
          <button id="lightboxPrevBtn" onclick="prevLightboxImage(event)" class="absolute left-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/20 hover:bg-white/40 text-white backdrop-blur-md flex items-center justify-center text-2xl transition shadow-lg">
            ‹
          </button>

          <!-- 右翻页按钮 -->
          <button id="lightboxNextBtn" onclick="nextLightboxImage(event)" class="absolute right-3 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full bg-white/20 hover:bg-white/40 text-white backdrop-blur-md flex items-center justify-center text-2xl transition shadow-lg">
            ›
          </button>

          <!-- 计数器（如 1 / 4） -->
          <div id="lightboxCounter" class="absolute bottom-3 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full bg-black/60 backdrop-blur text-white text-xs font-mono">
            1 / 1
          </div>
        </div>

        <!-- 右侧信息栏 -->
        <div class="lg:w-1/4 p-6 flex flex-col justify-between border-t lg:border-t-0 lg:border-l border-slate-800 bg-slate-900 text-white">
          <div>
            <span id="lightboxTag" class="inline-block px-2.5 py-1 rounded bg-brand-500/20 text-cyanAccent-400 text-[10px] font-bold uppercase tracking-wider mb-3">TAG</span>
            <h3 id="lightboxTitle" class="text-lg font-bold text-white mb-2">标题</h3>
            <p id="lightboxDesc" class="text-xs text-slate-400 leading-relaxed mb-4">描述文字</p>
            <div class="space-y-2 text-xs text-slate-400">
              <div class="flex items-center gap-2"><i data-lucide="folder" class="w-3.5 h-3.5 text-brand-400"></i><span id="lightboxCategory">分类</span></div>
              <div class="flex items-center gap-2"><i data-lucide="calendar" class="w-3.5 h-3.5 text-brand-400"></i><span id="lightboxDate">归档日期</span></div>
            </div>
          </div>
          <div class="pt-6 border-t border-slate-800 mt-6">
            <a id="lightboxDownloadBtn" href="#" target="_blank" download class="w-full py-2.5 bg-brand-600 hover:bg-brand-500 text-white text-xs font-medium rounded-lg text-center flex items-center justify-center gap-2 transition">
              <i data-lucide="external-link" class="w-3.5 h-3.5"></i> 查看当前高清原图
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>


                       </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 页脚 ================= -->
  <footer class="border-t border-slate-200 bg-white py-8 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400">
      <p>© 2026源创智慧图册· 一切版权归浙江源创智控技术有限公司所有</p>
      <p class="flex items-center gap-1.5">
  
      </p>
    </div>
  </footer>

  <!-- ================= 核心数据驱动脚本 (修改与扩展都在这里) ================= -->
  <script>
    /*
     * 💡【极为重要】：以后加分类、加内容，只要看这里！
     * 1. 想加分类：直接在 categories 列表里加。
     * 2. 想加相片/产品：直接在 galleryItems 列表里复制一项追加。
     */

    // 1. 分类字典定义 (严格符合你的要求)
    const categoryConfig = [
      { id: 'all', name: '全部图集', sub: [] },
      { 
        id: 'products', 
        name: '源创产品图集', 
        sub: ['全部产品', 'PCS200系列', 'PCS600系列', '硬件系列'] 
      },
      { 
        id: 'culture', 
        name: '源创聚力影像', 
        sub: ['全部聚力', '生日会', '活动', '节日'] 
      },
      { 
        id: 'market', 
        name: '市场活动', 
        sub: ['全部年份', '2026'] 
      }
    ];

    // 2. 照片图集数据库 (支持本地相对路径如 'images/xxx.jpg'，也支持在线图片)
    const galleryItems = [
      // ====== 源创产品图集 ======
      {
        id: 1,
        title: "PEC-208-8644",
        category: "products",
        subCategory: "PCS200系列",
        desc: "源创智控分布式核心控制模组。",
        images: ["PEC-208-8644.png","PEC-208-8644te.JPG"], // 替换为你自己的 images/xxx.jpg
        date: "2026-10",
        tag: "硬件"
      },
      {
        id: 2,
        title: "AI-8",
        category: "products",
        subCategory: "PCS200系列",
        desc: "BA系统扩展IO模块。",
        images: ["AI-8.png","AI-8ce.JPG"],
        date: "2026-10",
        tag: "硬件"
      },
      {
        id: 3,
        title: "AO-8",
        category: "products",
        subCategory: "PCS200系列",
        desc: "BA系统扩展IO模块。",
       images: ["AO-8.png","AO-8ce.JPG"],
        date: "2026-10",
        tag: "硬件"
      },
 {
        id: 4,
        title: "DI-16",
        category: "products",
        subCategory: "PCS200系列",
        desc: "BA系统扩展IO模块。",
       images: ["DI-16.png","DI-16ce.JPG"],
        date: "2026-10",
        tag: "硬件"
      },
 {
        id: 5,
        title: "DIO-12",
        category: "products",
        subCategory: "PCS200系列",
        desc: "BA系统扩展IO模块。",
       images: ["DIO-12.png","DIO-12ce.JPG"],
        date: "2026-10",
        tag: "硬件"
      },

      // ====== 源创聚力影像 ======
      {
        id: 6,
        title: "2026 第三季度员工集体生日会",
        category: "culture",
        subCategory: "生日会",
        desc: "温情源创，感恩同行。",
       images: ["436A2880.JPG","436A2903.JPG"],
        date: "2026-10",
        tag: "CULTURE"
      },
      {
        id: 7,
        title: "李家斌读书分享会",
        category: "culture",
        subCategory: "读书分享会",
        desc: "软件研发部李嘉兵带来颠覆认知的著作《与神对话》。",
        images: ["436A1660.JPG","436A1577.JPG"],
        date: "2026-10",
        tag: "TEAM BUILDING"
      },
      
      // ====== 市场活动 ======
      {
        id: 8,
        title: "2026粤港澳大湾区暖通空调行业年会",
        category: "market",
        subCategory: "2026",
        desc: "直击现场，源创智控亮相2026粤港澳大湾区暖通空调行业年会。",
        image: "PGJ6312.jpg",
        date: "2026-10",
        tag: "EXHIBITION 2026"
      }
    ];

    // ================= 逻辑控制核心 =================
        // ================= 逻辑控制核心（支持多图翻页） =================
    let currentPrimaryCategory = 'all';
    let currentSecondaryCategory = 'all';
    let searchQuery = '';

    // 当前弹窗多图状态
    let currentModalImages = [];
    let currentModalIdx = 0;

    // 初始化渲染
    function init() {
      renderPrimaryTabs();
      renderSecondaryTabs();
      renderGallery();
      lucide.createIcons();
    }

    // 渲染一级分类
    function renderPrimaryTabs() {
      const container = document.getElementById('primaryCategoryTabs');
      container.innerHTML = categoryConfig.map(cat => {
        const isActive = currentPrimaryCategory === cat.id;
        return `
          <button 
            onclick="setPrimaryCategory('${cat.id}')"
            class="px-5 py-2.5 rounded-full text-xs font-bold transition-all ${
              isActive 
                ? 'bg-slate-900 text-white shadow-md shadow-slate-900/10' 
                : 'bg-white text-slate-600 hover:bg-slate-100 hover:text-slate-900 border border-slate-200'
            }"
          >
            ${cat.name}
          </button>
        `;
      }).join('');
    }

    // 渲染二级子分类胶囊
    function renderSecondaryTabs() {
      const container = document.getElementById('secondaryCategoryTabs');
      const activeCatObj = categoryConfig.find(c => c.id === currentPrimaryCategory);

      if (!activeCatObj || activeCatObj.sub.length === 0) {
        container.innerHTML = '';
        container.classList.add('hidden');
        return;
      }

      container.classList.remove('hidden');
      container.innerHTML = activeCatObj.sub.map((sub, index) => {
        const isAll = (index === 0 && (currentSecondaryCategory === 'all' || currentSecondaryCategory === sub));
        const isActive = isAll || currentSecondaryCategory === sub;
        return `
          <button 
            onclick="setSecondaryCategory('${index === 0 ? 'all' : sub}')"
            class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all ${
              isActive 
                ? 'bg-brand-500 text-white shadow-sm' 
                : 'bg-slate-200/70 text-slate-600 hover:bg-slate-200'
            }"
          >
            ${sub}
          </button>
        `;
      }).join('');
    }

    function setPrimaryCategory(catId) {
      currentPrimaryCategory = catId;
      currentSecondaryCategory = 'all';
      renderPrimaryTabs();
      renderSecondaryTabs();
      renderGallery();
      lucide.createIcons();
    }

    function setSecondaryCategory(subName) {
      currentSecondaryCategory = subName;
      renderSecondaryTabs();
      renderGallery();
      lucide.createIcons();
    }

    // 渲染相册主体（卡片带张数标签）
    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      const empty = document.getElementById('emptyState');

      const filtered = galleryItems.filter(item => {
        const matchPrimary = (currentPrimaryCategory === 'all') || (item.category === currentPrimaryCategory);
        const matchSecondary = (currentSecondaryCategory === 'all') || (item.subCategory === currentSecondaryCategory);
        const matchSearch = searchQuery === '' || 
          item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.subCategory.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.tag.toLowerCase().includes(searchQuery.toLowerCase());

        return matchPrimary && matchSecondary && matchSearch;
      });

      document.getElementById('assetCount').innerText = `${galleryItems.length} 份画册资产`;
      document.getElementById('itemCountLabel').innerText = `共显示 ${filtered.length} 项`;

      const primaryName = categoryConfig.find(c => c.id === currentPrimaryCategory)?.name || '全部';
      const secondaryName = currentSecondaryCategory === 'all' ? '' : ` / ${currentSecondaryCategory}`;
      document.getElementById('currentFilterLabel').innerText = `${primaryName}${secondaryName}`;

      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = filtered.map(item => {
        const imgList = item.images || [item.image];
        const coverImg = imgList[0];
        const countBadge = imgList.length > 1 
          ? `<div class="absolute bottom-3 right-3 px-2 py-0.5 rounded-md bg-black/70 backdrop-blur text-white text-[10px] font-medium shadow flex items-center gap-1">
               <span>📷</span><span>${imgList.length} 张</span>
             </div>` 
          : '';

        return `
          <div 
            onclick="openLightbox(${item.id})"
            class="group bg-white rounded-2xl overflow-hidden border border-slate-200/90 hover:border-brand-500/40 shadow-sm hover:shadow-xl hover:-translate-y-1.5 card-transition cursor-pointer flex flex-col"
          >
            <div class="relative aspect-[16/10] bg-slate-100 overflow-hidden">
              <img 
                src="${coverImg}" 
                alt="${item.title}" 
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out"
                loading="lazy"
                onerror="this.src='https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=1000&q=80'"
              >
              <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur-md px-2.5 py-1 rounded-md text-[10px] font-bold text-white tracking-wider uppercase border border-white/10 flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-cyanAccent-400"></span>
                ${item.tag}
              </div>
              <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-md px-2.5 py-0.5 rounded-full text-[11px] font-semibold text-slate-700 shadow-sm">
                ${item.subCategory}
              </div>
              ${countBadge}
            </div>

            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <h3 class="text-base font-bold text-slate-900 group-hover:text-brand-600 transition-colors line-clamp-1">
                  ${item.title}
                </h3>
                <p class="text-xs text-slate-500 mt-2 line-clamp-2 leading-relaxed font-normal">
                  ${item.desc}
                </p>
              </div>
              <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
                <span class="font-medium">${item.date} 归档</span>
                <span class="font-semibold text-brand-600 group-hover:translate-x-0.5 transition-transform flex items-center gap-0.5">
                  查看细节 →
                </span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 搜索功能
    function handleSearch() {
      searchQuery = document.getElementById('searchInput').value.trim();
      const clearBtn = document.getElementById('clearSearchBtn');
      if (searchQuery.length > 0) clearBtn.classList.remove('hidden');
      else clearBtn.classList.add('hidden');
      renderGallery();
      lucide.createIcons();
    }

    function handleMobileSearch() {
      searchQuery = document.getElementById('mobileSearchInput').value.trim();
      renderGallery();
      lucide.createIcons();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      searchQuery = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderGallery();
      lucide.createIcons();
    }

    function resetFilters() {
      currentPrimaryCategory = 'all';
      currentSecondaryCategory = 'all';
      clearSearch();
      renderPrimaryTabs();
      renderSecondaryTabs();
    }

    // 打开大图弹窗
    function openLightbox(id) {
      const item = galleryItems.find(i => i.id === id);
      if (!item) return;

      currentModalImages = item.images || [item.image];
      currentModalIdx = 0;
      // 在打开弹窗显示当前图片的同时，把该产品的所有其他图片在后台静默预加载
if (item.images && item.images.length > 1) {
  item.images.forEach(imgUrl => {
    const preloadImg = new Image();
    preloadImg.src = imgUrl; // 浏览器会在后台悄悄下载缓存，点下一张直接秒开！
  });
}


      document.getElementById('lightboxTitle').innerText = item.title;
      document.getElementById('lightboxDesc').innerText = item.desc;
      document.getElementById('lightboxTag').innerText = item.tag;
      document.getElementById('lightboxCategory').innerText = item.subCategory;
      document.getElementById('lightboxDate').innerText = `${item.date} 归档入库`;

      updateLightboxDisplay();

      const lightbox = document.getElementById('lightbox');
      lightbox.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      lucide.createIcons();
    }

    // 更新弹窗中的图片和张数
    function updateLightboxDisplay() {
      const currentUrl = currentModalImages[currentModalIdx];
      document.getElementById('lightboxImg').src = currentUrl;
      document.getElementById('lightboxDownloadBtn').href = currentUrl;

      const prevBtn = document.getElementById('lightboxPrevBtn');
      const nextBtn = document.getElementById('lightboxNextBtn');
      const counter = document.getElementById('lightboxCounter');

      if (currentModalImages.length > 1) {
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
        counter.style.display = 'block';
        counter.innerText = `${currentModalIdx + 1} / ${currentModalImages.length}`;
      } else {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
        counter.style.display = 'none';
      }
    }

    // 上一张
    function prevLightboxImage(e) {
      if (e) e.stopPropagation();
      currentModalIdx = (currentModalIdx - 1 + currentModalImages.length) % currentModalImages.length;
      updateLightboxDisplay();
    }

    // 下一张
    function nextLightboxImage(e) {
      if (e) e.stopPropagation();
      currentModalIdx = (currentModalIdx + 1) % currentModalImages.length;
      updateLightboxDisplay();
    }

    function closeLightbox(event) {
      document.getElementById('lightbox').classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    // 键盘支持：ESC 退出，左右方向键翻页
    window.addEventListener('keydown', (e) => {
      const lightbox = document.getElementById('lightbox');
      if (!lightbox.classList.contains('hidden')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') prevLightboxImage();
        if (e.key === 'ArrowRight') nextLightboxImage();
      }
    });

    window.onload = init;

  </script>
</body>
</html>
